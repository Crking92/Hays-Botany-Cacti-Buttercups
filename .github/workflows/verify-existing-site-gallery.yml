name: Verify existing Cacti-Buttercups public gallery and site bytes
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/verify_existing_site.py'
      - '.github/workflows/verify-existing-site-gallery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit existing public records and photo blob hashes
        run: python3 scripts/verify_existing_site.py
      - name: Wait until public Pages reaches this photo gallery revision
        run: |
          python3 - <<'PY'
          import time,urllib.request
          from pathlib import Path
          checks=[Path("site/data/gallery-index.json"),Path("site/data/species/ranunculus-macranthus.json")]
          base="https://crking92.github.io/Hays-Botany-Cacti-Buttercups/"
          for attempt in range(30):
              pending=[]
              for path in checks:
                  try:
                      url=base+str(path)+"?audit="+str(attempt)
                      with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"HaysBotanyLivePhotos/1.0","Cache-Control":"no-cache"}),timeout=20) as response:
                          if response.read()!=path.read_bytes(): pending.append(str(path)+" byte mismatch")
                  except Exception as exc:
                      pending.append(str(path)+": "+str(exc))
              if not pending:
                  print("PUBLIC_GALLERY_INDEX_AND_CHANGED_SPECIES_ARE_CURRENT")
                  break
              print("Pages update pending:", "; ".join(pending))
              time.sleep(8)
          else: raise SystemExit("Live gallery index or Ranunculus species card has not reached current commit")
          PY
      - name: Verify published species JSON and gallery images
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Cacti-Buttercups/site/

# Full byte-by-byte public image audit after source-preserving website compression.
