name: Verify existing Cacti-Buttercups public gallery and site bytes
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/verify_existing_site.py'
      - '.github/workflows/verify-existing-site-gallery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit existing public records and photo blob hashes
        run: python3 scripts/verify_existing_site.py
      - name: Wait until public Pages reaches this photo gallery revision
        run: |
          python3 - <<'PY'
          import time,urllib.request
          from pathlib import Path
          expected=Path("site/data/gallery-index.json").read_bytes()
          url="https://crking92.github.io/Hays-Botany-Cacti-Buttercups/site/data/gallery-index.json"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url+"?audit="+str(attempt),headers={"User-Agent":"HaysBotanyLivePhotos/1.0"}),timeout=20) as response:
                      if response.read()==expected:
                          print("PUBLIC_GALLERY_INDEX_IS_CURRENT")
                          break
              except Exception as exc:
                  print("Pages update pending",str(exc))
              time.sleep(8)
          else: raise SystemExit("Live gallery has not reached current commit")
          PY
      - name: Verify published species JSON and gallery images
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Cacti-Buttercups/site/
